name: تحديث الرادار التقني

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # لا يبقى رمز الكتابة في .git أثناء معالجة محتوى خارجي
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: فحص الملفات والمصادر
        run: |
          node --check scripts/update.mjs
          node --check app.js
          node scripts/validate.mjs
          node scripts/test-parse.mjs
      - name: تحديث الرادار
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MAX: 24
        run: node scripts/update.mjs
      - name: حفظ البيانات المحدثة
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add news.json seen.json
          if ! git diff --staged --quiet; then
            git commit -m "تحديث الرادار التقني"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase origin "${GITHUB_REF_NAME}"   # يتحمّل تعديلاً يدوياً أُجري أثناء التشغيل
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
